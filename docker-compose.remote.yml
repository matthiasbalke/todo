services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/todo
      SPRING_DATASOURCE_USERNAME: todo
      SPRING_DATASOURCE_PASSWORD: todo
      JWT_SECRET: ZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50
    depends_on:
      postgres:
        condition: service_healthy

  backend-healthcheck:
    image: dhi.io/curl:8.14.1-dev
    entrypoint: ["sh", "-c", "trap exit TERM; while true; do sleep 60 & wait; done"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://backend:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/matthiasbalke/todo/frontend:main
    ports:
      - "3000:3000"
    environment:
      ORIGIN: http://localhost:3000
    depends_on:
      backend-healthcheck:
        condition: service_healthy

  all-in-one:
    image: ghcr.io/matthiasbalke/todo/all-in-one:main
    ports:
      - "80:80"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/todo
      SPRING_DATASOURCE_USERNAME: todo
      SPRING_DATASOURCE_PASSWORD: todo
      JWT_SECRET: ZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50
      ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy