events {}
http {
    # Docker service IPs can change when a development container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        client_max_body_size 25m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        location ~ ^/(api|actuator)(/|$) {
            set $backend http://backend:8080;
            proxy_pass $backend;
        }
        location / {
            set $frontend https://frontend:5173;
            # Local development hop only: the browser cert covers the public hostname,
            # not the Docker service name. Browser-facing TLS remains verified.
            proxy_ssl_verify off;
            proxy_pass $frontend;
        }
    }
}
