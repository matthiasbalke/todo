services:
  postgres:
    image: dhi.io/postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # IMPORTANT: The PGDATA path is now version-specific in the official image
      - postgres-db:/var/lib/postgresql

  backend:
    image: todo/backend:ci
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/todo
      SPRING_DATASOURCE_USERNAME: todo
      SPRING_DATASOURCE_PASSWORD: todo
      # this is not secure for production, generate a unique one
      JWT_SECRET: ZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50
      # this is set for e2e tests
      SETUP_SECRET: e2e-setup-secret
      RATE_LIMIT_CAPACITY: 10000
      RATE_LIMIT_WINDOW_MINUTES: 1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      WEBAUTHN_RP_ID: localhost
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/e2e-certs/e2e-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./e2e/certs:/e2e-certs:ro
    depends_on:
      postgres:
        condition: service_healthy

  mailpit-starttls:
    image: axllent/mailpit:v1.31.2
    command:
      - --smtp
      - 0.0.0.0:1025
      - --listen
      - 0.0.0.0:8025
      - --smtp-tls-cert
      - /certs/mailpit.pem
      - --smtp-tls-key
      - /certs/mailpit.key
      - --smtp-require-starttls
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - ./e2e/certs:/certs:ro

  mailpit-smtps:
    image: axllent/mailpit:v1.31.2
    command:
      - --smtp
      - 0.0.0.0:1465
      - --listen
      - 0.0.0.0:8025
      - --smtp-tls-cert
      - /certs/mailpit.pem
      - --smtp-tls-key
      - /certs/mailpit.key
      - --smtp-require-tls
    ports:
      - "1465:1465"
      - "8026:8025"
    volumes:
      - ./e2e/certs:/certs:ro

  backend-healthcheck:
    image: dhi.io/curl:8.14.1-dev
    entrypoint: ["sh", "-c", "trap exit TERM; while true; do sleep 60 & wait; done"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://backend:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: todo/frontend:ci
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      ORIGIN: http://localhost
      BACKEND_URL: http://backend:8080
    depends_on:
      backend-healthcheck:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend-healthcheck:
        condition: service_healthy

volumes:
  # IMPORTANT: The PGDATA path is now version-specific in the official image
  postgres-db:
