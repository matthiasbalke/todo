name: CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git diff --name-only "$BASE_SHA...HEAD" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          backend=false
          frontend=false
          e2e=false

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci.yml)
                backend=true
                frontend=true
                e2e=true
                ;;
              backend/*)
                backend=true
                e2e=true
                ;;
              frontend/*)
                frontend=true
                e2e=true
                ;;
              e2e/*|docker-compose.yml|nginx.conf)
                e2e=true
                ;;
            esac
          done < changed-files.txt

          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "e2e=${e2e}" >> "$GITHUB_OUTPUT"
          if [ "$backend" != true ] && [ "$frontend" != true ] && [ "$e2e" != true ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: todo/backend:ci
          outputs: type=docker,dest=/tmp/backend.tar
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha,scope=backend

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: /tmp/backend.tar
          retention-days: 1

  build-frontend:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          tags: todo/frontend:ci
          outputs: type=docker,dest=/tmp/frontend.tar
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha,scope=frontend

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-image
          path: /tmp/frontend.tar
          retention-days: 1

  test-backend:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: Run tests
        run: gradle test --no-daemon -Prelease
        working-directory: backend

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/

  test-frontend:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Type check
        run: bun run check
        working-directory: frontend

      - name: Unit tests
        run: bun run test -- --run
        working-directory: frontend

  e2e:
    needs: [detect-changes, build-backend, build-frontend]
    if: ${{ needs.detect-changes.outputs.e2e == 'true' }}
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # otherwise we get an authentication error when pulling using docker-compose
      - name: rebuild dhi.io/curl image
        env:
          # renovate: datasource=docker depName=dhi.io/curl
          CURL_VERSION: 8.14.1-dev
        run: |
          IMAGE="dhi.io/curl:${CURL_VERSION}"
          echo "FROM ${IMAGE}" | docker build -t "${IMAGE}" -

      # otherwise we get an authentication error when pulling using docker-compose
      - name: rebuild dhi.io/postgres image
        env:
          # renovate: datasource=docker depName=dhi.io/postgres
          POSTGRES_VERSION: 18.6-alpine3.24
        run: |
          IMAGE="dhi.io/postgres:${POSTGRES_VERSION}"
          echo "FROM ${IMAGE}" | docker build -t "${IMAGE}" -

      - name: Download backend image
        uses: actions/download-artifact@v8
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image
        uses: actions/download-artifact@v8
        with:
          name: frontend-image
          path: /tmp

      - name: Load Docker images
        run: |
          docker load < /tmp/backend.tar
          docker load < /tmp/frontend.tar

      - name: Start services
        run: docker compose up postgres backend backend-healthcheck frontend nginx --no-build --wait -d

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Install e2e dependencies
        run: bun install --frozen-lockfile
        working-directory: e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/bun.lockb') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: e2e
        env:
          SETUP_SECRET: e2e-setup-secret

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down

  ci-result:
    needs: [detect-changes, build-backend, build-frontend, test-backend, test-frontend, e2e]
    if: always()
    name: CI result
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BUILD_BACKEND_RESULT: ${{ needs.build-backend.result }}
          BUILD_FRONTEND_RESULT: ${{ needs.build-frontend.result }}
          TEST_BACKEND_RESULT: ${{ needs.test-backend.result }}
          TEST_FRONTEND_RESULT: ${{ needs.test-frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          E2E_CHANGED: ${{ needs.detect-changes.outputs.e2e }}
          DOCS_ONLY: ${{ needs.detect-changes.outputs.docs_only }}
        run: |
          set -euo pipefail

          failed=false
          for result in \
            "$DETECT_RESULT" \
            "$BUILD_BACKEND_RESULT" \
            "$BUILD_FRONTEND_RESULT" \
            "$TEST_BACKEND_RESULT" \
            "$TEST_FRONTEND_RESULT" \
            "$E2E_RESULT"; do
            case "$result" in
              failure|cancelled)
                failed=true
                ;;
            esac
          done

          require_success() {
            local job_name="$1"
            local result="$2"
            if [ "$result" != success ]; then
              echo "::error::${job_name} was expected to run, got '${result}'."
              failed=true
            fi
          }

          if [ "$BACKEND_CHANGED" = true ]; then
            require_success "Backend tests" "$TEST_BACKEND_RESULT"
          fi

          if [ "$FRONTEND_CHANGED" = true ]; then
            require_success "Frontend tests" "$TEST_FRONTEND_RESULT"
          fi

          if [ "$E2E_CHANGED" = true ]; then
            require_success "Backend image build" "$BUILD_BACKEND_RESULT"
            require_success "Frontend image build" "$BUILD_FRONTEND_RESULT"
            require_success "Playwright" "$E2E_RESULT"
          fi

          if [ "$failed" = true ]; then
            echo "::error::One or more relevant CI jobs failed or were cancelled."
            exit 1
          fi

          if [ "$DOCS_ONLY" = true ]; then
            echo "No backend, frontend, or E2E relevant changes detected."
          else
            echo "Relevant CI checks completed successfully."
          fi
