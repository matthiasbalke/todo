name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          tags: todo/backend:ci
          outputs: type=docker,dest=/tmp/backend.tar
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=backend' || '' }}

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: /tmp/backend.tar
          retention-days: 1

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          tags: todo/frontend:ci
          outputs: type=docker,dest=/tmp/frontend.tar
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=frontend' || '' }}

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-image
          path: /tmp/frontend.tar
          retention-days: 1

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.4.1

      - name: Run tests
        run: gradle test --no-daemon -Prelease
        working-directory: backend

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Type check
        run: bun run check
        working-directory: frontend

      - name: Unit tests
        run: bun run test -- --run
        working-directory: frontend

  e2e:
    needs: [build-backend, build-frontend]
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # otherwise we get an authentication error when pulling using docker-compose
      - name: Pre-pull backend-healthcheck image
        run: echo 'FROM dhi.io/curl:8.14.1-dev' | docker build -t dhi.io/curl:8.14.1-dev -

      - name: Download backend image
        uses: actions/download-artifact@v8
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image
        uses: actions/download-artifact@v8
        with:
          name: frontend-image
          path: /tmp

      - name: Load Docker images
        run: |
          docker load < /tmp/backend.tar
          docker load < /tmp/frontend.tar

      - name: Start services
        run: docker compose up postgres backend backend-healthcheck frontend nginx --no-build --wait -d

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Install e2e dependencies
        run: bun install --frozen-lockfile
        working-directory: e2e

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/bun.lockb') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
