name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set, for example 0.3.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-version:
    name: Bump project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.MATTHIASBALKE_TODO_BOT_APP_ID }}
          private-key: ${{ secrets.MATTHIASBALKE_TODO_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check deployment token
        env:
          DEPLOYMENT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Could not create a GitHub App token. Check MATTHIASBALKE_TODO_BOT_APP_ID and MATTHIASBALKE_TODO_BOT_APP_PRIVATE_KEY."
            exit 1
          fi

      - name: Check selected ref
        run: |
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "::error::Run this workflow from a branch, not a ${{ github.ref_type }}."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match MAJOR.MINOR.PATCH, for example '0.3.0'."
            exit 1
          fi

      - name: Update backend version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Eq '^val versionBase = "[0-9]+\.[0-9]+\.[0-9]+"$' backend/build.gradle.kts; then
            echo "::error::Could not find the backend versionBase assignment."
            exit 1
          fi

          sed -i -E "s/^val versionBase = \"[0-9]+\\.[0-9]+\\.[0-9]+\"$/val versionBase = \"$VERSION\"/" backend/build.gradle.kts

          if ! grep -Fxq "val versionBase = \"$VERSION\"" backend/build.gradle.kts; then
            echo "::error::Backend versionBase was not updated."
            exit 1
          fi

      - name: Update frontend version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/package.json';
          const version = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, '\t')}\n`);
          NODE

          UPDATED_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$UPDATED_VERSION" != "$VERSION" ]; then
            echo "::error::Frontend package version was not updated."
            exit 1
          fi

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "matthiasbalke-todo-bot"
          git config user.email "matthiasbalke-todo-bot@users.noreply.github.com"
          git add backend/build.gradle.kts frontend/package.json

          if git diff --staged --quiet; then
            echo "Version files already contain $VERSION. No commit needed."
            exit 0
          fi

          git commit -m "Bump version to $VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
