spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/todo
    username: todo
    password: todo
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

webauthn:
  rp:
    id: ${WEBAUTHN_RP_ID:localhost}
    name: ${WEBAUTHN_RP_NAME:Todo}

jwt:
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50}
  issuer: ${JWT_ISSUER:todo-app}
  audience: ${JWT_AUDIENCE:todo-api}
  access-token-ttl: PT15M
  refresh-token-ttl: P30D

sse:
  heartbeat:
    interval-ms: 25000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  security:
    rate-limit:
      capacity: ${RATE_LIMIT_CAPACITY:50}
      window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:1}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U}
  private-key: ${VAPID_PRIVATE_KEY:0ZmUSW6SHvJYuqe3NiNMEGYBPTrQMEw-Bco9SMg6bPc}
  subject: ${VAPID_SUBJECT:mailto:admin@example.com}

push:
  schedule:
    daily-cron: "0 0 8 * * *"

management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
